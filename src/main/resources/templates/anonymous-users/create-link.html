<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>TinyURL — Shorten a Link</title>
  <link rel="stylesheet" th:href="@{/css/main.css}"/>
</head>
<body>
<div class="page centered">
  <div class="container">
    <div class="card">
      <h1 class="card-title">tinyurl</h1>
      <p class="card-subtitle">Paste a long link, get a short one. No account needed.</p>

      <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

      <form th:action="@{/create-link}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <div class="field">
          <label for="url">Original URL <span style="color:var(--danger)">*</span></label>
          <input id="url" name="url" type="url"
                 placeholder="https://example.com/very/long/url"
                 required autofocus/>
          <p class="hint">Your link will be active for 3 days.</p>
        </div>
        <button type="submit" class="btn btn-primary btn-full">Shorten</button>
      </form>
      <p class="hint" style="text-align:center; margin-top:1.25rem;">
        <a th:href="@{/login}">Log in</a> for link management features.
      </p>
    </div>
  </div>
</div>
</body>
</html>
