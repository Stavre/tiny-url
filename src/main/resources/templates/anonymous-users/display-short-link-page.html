<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>TinyURL — Short Link</title>
  <link rel="stylesheet" th:href="@{/css/main.css}"/>
</head>
<body>
<div class="page centered">
  <div class="container">
    <div class="card">
      <h1 class="card-title">Your short link is ready</h1>
      <p class="card-subtitle">Copy it and share anywhere.</p>

      <div class="url-box" th:with="url=${redirectBase + link.shortLinkId}">
        <a th:href="${url}" th:text="${url}"
           target="_blank" rel="noopener noreferrer"></a>
        <button type="button" id="copyBtn" class="btn btn-secondary btn-sm">Copy</button>
      </div>

      <p class="hint" th:if="${link.activeUntil != null}">
        Expires <span th:text="${#temporals.format(link.activeUntil, 'dd MMM yyyy, HH:mm')}"></span>
      </p>

      <div class="btn-row">
        <a th:href="@{/create-link}" class="btn btn-primary">Shorten another</a>
      </div>
      <p class="hint" style="text-align:center; margin-top:0.75rem;">
        <a th:href="@{/login}">Log in</a> for link management features.
      </p>
    </div>
  </div>
</div>
<script th:src="@{/js/clipboard.js}"></script>
</body>
</html>
