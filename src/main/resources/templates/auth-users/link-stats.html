<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>TinyURL — Link Stats</title>
  <link rel="stylesheet" th:href="@{/css/main.css}"/>
</head>
<body>

<th:block th:replace="~{fragments :: nav}"></th:block>

<div class="page">
  <div class="container-wide">
    <div class="card">
      <h1 class="card-title">Usage stats</h1>

      <div class="detail-list">
        <span class="dl-label">Short URL</span>
        <span class="dl-value">
          <a th:href="${redirectBase + link.shortLinkId}"
             th:text="${redirectBase + link.shortLinkId}"
             target="_blank" rel="noopener noreferrer"></a>
        </span>
        <span class="dl-label">Original URL</span>
        <span class="dl-value">
          <a th:href="${link.originalUrl}" th:text="${link.originalUrl}"
             target="_blank" rel="noopener noreferrer"></a>
        </span>
        <span class="dl-label">Status</span>
        <span class="dl-value">
          <span class="badge"
                th:classappend="${link.active ? 'badge-active' : 'badge-expired'}"
                th:text="${link.active ? 'Active' : 'Expired'}"></span>
        </span>
        <span class="dl-label">Total uses</span>
        <span class="dl-value" th:text="${totalUses}">0</span>
      </div>

      <hr/>

      <div th:if="${#lists.isEmpty(timestamps)}" class="empty-state">
        <p>No usage recorded yet.</p>
      </div>

      <canvas th:if="${!#lists.isEmpty(timestamps)}" id="usageChart"></canvas>

      <div class="btn-row" style="margin-top:1.5rem;">
        <a th:href="@{/dashboard}" class="btn btn-secondary">Back to dashboard</a>
      </div>
    </div>
  </div>
</div>


<th:block th:if="${!#lists.isEmpty(timestamps)}">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
  <script th:inline="javascript">
    const timestamps = /*[[${timestamps}]]*/ [];

    const bucket = {};
    timestamps.forEach(t => {
      const d = new Date(t);
      d.setMinutes(0, 0, 0);
      const key = d.toISOString();
      bucket[key] = (bucket[key] || 0) + 1;
    });
    const chartData = Object.entries(bucket)
      .sort(([a], [b]) => a < b ? -1 : 1)
      .map(([x, y]) => ({ x, y }));

    new Chart(document.getElementById('usageChart'), {
      type: 'bar',
      data: {
        datasets: [{
          data: chartData,
          backgroundColor: 'rgba(79,70,229,0.6)',
          borderColor: 'rgba(79,70,229,1)',
          borderWidth: 1,
          borderRadius: 4
        }]
      },
      options: {
        responsive: true,
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: {
              title: items => new Date(items[0].raw.x).toLocaleString(),
              label: item => 'Uses: ' + item.raw.y
            }
          }
        },
        scales: {
          x: {
            type: 'time',
            time: {
              displayFormats: { hour: 'MMM d, HH:mm', day: 'MMM d' }
            }
          },
          y: {
            beginAtZero: true,
            ticks: { stepSize: 1, precision: 0 }
          }
        }
      }
    });
  </script>
</th:block>

</body>
</html>
