<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>TinyURL — Link Created</title>
  <link rel="stylesheet" th:href="@{/css/main.css}"/>
</head>
<body>

<th:block th:replace="~{fragments :: nav}"></th:block>

<div class="page">
  <div class="container">
    <div class="card">
      <h1 class="card-title">Link created</h1>
      <p class="card-subtitle">Your short URL is ready to share.</p>

      <div class="url-box" th:with="url=${redirectBase + link.shortLinkId}">
        <a th:href="${url}" th:text="${url}"
           target="_blank" rel="noopener noreferrer"></a>
        <button type="button" id="copyBtn" class="btn btn-secondary btn-sm">Copy</button>
      </div>

      <div class="detail-list">
        <span class="dl-label">Created</span>
        <span class="dl-value" th:text="${#temporals.format(link.createdAt, 'dd MMM yyyy, HH:mm')}"></span>

        <span class="dl-label">Active from</span>
        <span class="dl-value"
              th:text="${link.activeFrom != null ? #temporals.format(link.activeFrom, 'dd MMM yyyy, HH:mm') : 'Immediately'}">
        </span>

        <span class="dl-label">Expires</span>
        <span class="dl-value"
              th:text="${link.activeUntil != null ? #temporals.format(link.activeUntil, 'dd MMM yyyy, HH:mm') : 'Never'}">
        </span>

        <th:block th:if="${link.description != null and !link.description.isEmpty()}">
          <span class="dl-label">Description</span>
          <span class="dl-value" th:text="${link.description}"></span>
        </th:block>
      </div>

      <div class="btn-row">
        <a th:href="@{/create-link}" class="btn btn-primary">Create another</a>
        <a th:href="@{/dashboard}"   class="btn btn-secondary">Dashboard</a>
      </div>
    </div>
  </div>
</div>

<script th:src="@{/js/clipboard.js}"></script>
</body>
</html>
