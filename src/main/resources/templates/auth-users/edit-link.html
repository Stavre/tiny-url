<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>TinyURL — Edit Link</title>
  <link rel="stylesheet" th:href="@{/css/main.css}"/>
</head>
<body>

<th:block th:replace="~{fragments :: nav}"></th:block>

<div class="page">
  <div class="container">
    <div class="card">
      <h1 class="card-title">Edit link</h1>
      <p class="card-subtitle">Update the URL, description, or validity window.</p>

      <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
      <div th:if="${error}"   class="alert alert-error"   th:text="${error}"></div>

      <p class="section-heading">Current details</p>
      <div class="detail-list">
        <span class="dl-label">Short URL</span>
        <span class="dl-value" th:with="url=${redirectBase + link.shortLinkId}">
          <a th:href="${url}" th:text="${url}"
             target="_blank" rel="noopener noreferrer"></a>
        </span>
        <span class="dl-label">Created</span>
        <span class="dl-value" th:text="${#temporals.format(link.createdAt, 'dd MMM yyyy, HH:mm')}"></span>
        <span class="dl-label">Last updated</span>
        <span class="dl-value"
              th:text="${link.updatedAt != null ? #temporals.format(link.updatedAt, 'dd MMM yyyy, HH:mm') : '—'}">
        </span>
      </div>

      <hr/>

      <form id="editForm" th:action="@{/update-link}" method="post" novalidate>
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <input type="hidden" name="shortLinkId" th:value="${link.shortLinkId}"/>

        <div class="field">
          <label for="originalUrl">Original URL <span style="color:var(--danger)">*</span></label>
          <input id="originalUrl" name="originalUrl" type="url"
                 th:value="${link.originalUrl}"
                 placeholder="https://example.com/very/long/url" required/>
        </div>

        <div class="field">
          <label for="description">Description</label>
          <input id="description" name="description" type="text"
                 placeholder="Optional short description"
                 th:value="${link.description}"/>
        </div>

        <p class="section-heading">Validity window</p>

        <div class="date-row">
          <div class="field">
            <label for="activeFrom">Active From</label>
            <input id="activeFrom" name="activeFrom" type="datetime-local"
                   th:value="${link.activeFrom != null ? #temporals.format(link.activeFrom, 'yyyy-MM-dd''T''HH:mm') : ''}"/>
          </div>
          <div class="field">
            <label for="activeUntil">Active Until</label>
            <input id="activeUntil" name="activeUntil" type="datetime-local"
                   th:value="${link.activeUntil != null ? #temporals.format(link.activeUntil, 'yyyy-MM-dd''T''HH:mm') : ''}"/>
          </div>
        </div>

        <p class="field-error" id="dateError"></p>
        <p class="field-warn"  id="dateWarning"></p>

        <div class="preset-row">
          <button type="button" class="btn btn-secondary btn-sm" data-preset data-value="7"  data-unit="days">7 days</button>
          <button type="button" class="btn btn-secondary btn-sm" data-preset data-value="30" data-unit="days">30 days</button>
          <button type="button" class="btn btn-secondary btn-sm" data-preset data-value="1"  data-unit="year">1 year</button>
          <button type="button" class="btn btn-secondary btn-sm" data-clear-dates>Clear</button>
        </div>

        <div class="form-actions">
          <button type="submit" id="submitBtn" class="btn btn-primary">Save changes</button>
          <a th:href="@{/dashboard}" class="btn btn-secondary">Cancel</a>
        </div>
      </form>

      <hr/>

      <div class="danger-zone">
        <p class="section-heading">Danger zone</p>
        <p class="hint" style="margin-bottom:0.75rem;">This permanently deletes the short link and cannot be undone.</p>
        <form th:action="@{/delete-link/{id}(id=${link.shortLinkId})}" method="post"
              data-confirm="Delete this link? This cannot be undone.">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
          <button type="submit" class="btn btn-danger">Delete this link</button>
        </form>
      </div>

    </div>
  </div>
</div>

<script th:src="@{/js/date-utils.js}"></script>
<script th:src="@{/js/edit-link.js}"></script>
<script th:src="@{/js/confirm.js}"></script>
</body>
</html>
