<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>TinyURL — Dashboard</title>
  <link rel="stylesheet" th:href="@{/css/main.css}"/>
</head>
<body>

<th:block th:replace="~{fragments :: nav}"></th:block>

<div class="page">
  <div class="container-wide">

    <h1 class="page-heading">Your links</h1>

    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-num" th:text="${linkCount.totalLinks}">0</div>
        <div class="stat-label">Total</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" th:text="${linkCount.activeLinks}">0</div>
        <div class="stat-label">Active</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" th:text="${linkCount.expiredLinks}">0</div>
        <div class="stat-label">Expired</div>
      </div>
    </div>

    <div th:if="${not #lists.isEmpty(links)}" class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Short URL</th>
            <th>Original URL</th>
            <th>Description</th>
            <th>Created</th>
            <th>Active From</th>
            <th>Active Until</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="link : ${links}">
            <td class="td-url" th:with="url=${redirectBase + link.shortLinkId}">
              <a th:href="${url}" th:text="${url}"
                 target="_blank" rel="noopener noreferrer"></a>
            </td>
            <td class="td-url">
              <a th:href="${link.originalUrl}" th:text="${link.originalUrl}"
                 target="_blank" rel="noopener noreferrer"></a>
            </td>
            <td th:text="${link.description != null and !link.description.isEmpty() ? link.description : '—'}"></td>
            <td th:text="${#temporals.format(link.createdAt, 'dd MMM yyyy')}"></td>
            <td th:text="${link.activeFrom  != null ? #temporals.format(link.activeFrom,  'dd MMM yyyy') : '—'}"></td>
            <td th:text="${link.activeUntil != null ? #temporals.format(link.activeUntil, 'dd MMM yyyy') : 'Never'}"></td>
            <td>
              <span class="badge"
                    th:classappend="${link.active ? 'badge-active' : 'badge-expired'}"
                    th:text="${link.active ? 'Active' : 'Expired'}">
              </span>
            </td>
            <td>
              <div class="td-actions">
                <a th:href="@{/link-stats/{id}(id=${link.shortLinkId})}"
                   class="btn btn-secondary btn-sm">Stats</a>
                <a th:href="@{/update-link/{id}(id=${link.shortLinkId})}"
                   class="btn btn-secondary btn-sm">Edit</a>
                <form th:action="@{/delete-link/{id}(id=${link.shortLinkId})}" method="post"
                      data-confirm="Delete this link?">
                  <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                  <button type="submit" class="btn btn-danger btn-sm">Delete</button>
                </form>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <div th:if="${#lists.isEmpty(links)}" class="empty-state">
      <h3>No links yet</h3>
      <p>Create your first short link to get started.</p>
      <a th:href="@{/create-link}" class="btn btn-primary">Create a link</a>
    </div>

  </div>
</div>

<script th:src="@{/js/confirm.js}"></script>
</body>
</html>
