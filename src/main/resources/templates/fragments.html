<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head><title>fragments</title></head>
<body>

<nav th:fragment="nav">
  <div class="nav-inner">
    <a class="nav-logo" th:href="@{/}">tinyurl</a>
    <a class="nav-link"
       th:classappend="${currentPath == '/dashboard'} ? ' active' : ''"
       th:href="@{/dashboard}">Dashboard</a>
    <a class="nav-link primary"
       th:classappend="${currentPath == '/create-link'} ? ' active' : ''"
       th:href="@{/create-link}">+ New Link</a>
    <form th:action="@{/logout}" method="post" class="nav-logout">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
      <button type="submit" class="nav-link">Log out</button>
    </form>
  </div>
</nav>

</body>
</html>
