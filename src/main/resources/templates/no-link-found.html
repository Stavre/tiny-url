<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>TinyURL — Link Not Found</title>
  <link rel="stylesheet" th:href="@{/css/main.css}"/>
</head>
<body>
<div class="page centered">
  <div class="container">
    <div class="error-page">
      <div class="error-code">404</div>
      <h1 class="error-title">Link not found</h1>
      <p class="error-body">
        This short link doesn't exist, has expired, or was removed.<br/>
        Free links are active for 3 days after creation.
      </p>
      <div class="btn-row" style="justify-content:center;">
        <a th:href="@{/create-link}" class="btn btn-primary">Create a new link</a>
        <a th:href="@{/login}"       class="btn btn-secondary">Log in</a>
      </div>
    </div>
  </div>
</div>
</body>
</html>
